- name: Install pgBackRest packages across all infrastructure
  hosts: env_dev:&repo_psql, repo_db_backups
  become: yes
  roles:
    - backup_packages

- name: Configure pgBackRest repository host
  hosts: repo_db_backup
  become: yes
  roles:
    - pgbackrest_setup_target

- name: Configure pgBackRest on database nodes
  hosts: env_dev:&repo_psql
  become: yes
  roles:
    - pgbackrest_setup_dbs