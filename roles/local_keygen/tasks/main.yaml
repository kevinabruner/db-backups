# --- Run once on controller to generate the shared key ---
- name: Ensure local temp directory exists for key generation
  file:
    path: /tmp/pgbackrest_keys
    state: directory
  delegate_to: localhost
  run_once: yes

- name: Generate shared SSH key pair on Ansible controller
  openssh_keypair:
    path: /tmp/pgbackrest_keys/id_rsa
    type: rsa
    size: 4096
  delegate_to: localhost
  run_once: yes

- name: Read shared private key content
  slurp:
    src: /tmp/pgbackrest_keys/id_rsa
  delegate_to: localhost
  run_once: yes
  register: shared_private_key

- name: Read shared public key content
  slurp:
    src: /tmp/pgbackrest_keys/id_rsa.pub
  delegate_to: localhost
  run_once: yes
  register: shared_public_key

- name: Configure SSH client to automatically accept host keys
  copy:
    content: |
      Host *
          StrictHostKeyChecking accept-new
          UserKnownHostsFile /home/postgres/.ssh/known_hosts
    dest: /home/postgres/.ssh/config
    owner: postgres
    group: postgres
    mode: '0600'
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  run_once: yes
  become: yes
