- name: Ensure postgres user exists
  user:
    name: postgres
    system: yes
    shell: /bin/bash
    create_home: yes

- name: Get postgres user home directory
  getent:
    database: passwd
    key: postgres

- name: Ensure .ssh directory exists for postgres
  file:
    path: "{{ ansible_facts.getent_passwd['postgres'][4] }}/.ssh"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Generate SSH key pair for postgres
  openssh_keypair:
    path: "{{ ansible_facts.getent_passwd['postgres'][4] }}/.ssh/id_rsa"
    type: rsa
    size: 4096
    owner: postgres
    group: postgres
    mode: '0600'

# --- BLOCK 1: Database Nodes Setup ---
- block:
    - name: Read backup repository public key
      slurp:
        src: /var/lib/postgresql/.ssh/id_rsa.pub
      register: backup_repo_pubkey
      delegate_to: "{{ groups['repo_db_backups'][0] }}"
      run_once: yes

    - name: Authorize backup VM key on database nodes
      authorized_key:
        user: postgres
        key: "{{ backup_repo_pubkey['content'] | b64decode }}"
  when: inventory_hostname not in groups['repo_db_backups']

# --- BLOCK 2: Backup Repository Setup ---
- block:
    - name: Read database node public keys
      slurp:
        src: "{{ ansible_facts.getent_passwd['postgres'][4] }}/.ssh/id_rsa.pub"
      register: db_pubkeys
      delegate_to: "{{ item }}"
      loop: "{{ groups['env_dev:&repo_psql:!role_vm_template'] }}"

    - name: Authorize database node keys on backup VM
      authorized_key:
        user: postgres
        key: "{{ item['content'] | b64decode }}"
      loop: "{{ db_pubkeys.results }}"
  when: inventory_hostname in groups['repo_db_backups']