- name: Ensure pgBackRest configuration directory exists
  file:
    path: /etc/pgbackrest
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'
    
- name: Deploy pgbackrest configuration
  template:
    src: templates/pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: '0640'

- name: Read backup repository public key
  slurp:
    src: ~postgres/.ssh/id_rsa.pub
  register: backup_repo_pubkey
  delegate_to: db-backups
  run_once: yes

- name: Authorize backup VM key on database nodes
  authorized_key:
    user: postgres
    key: "{{ backup_repo_pubkey['content'] | b64decode }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['env_dev:&repo_psql:!role_vm_template'] }}"