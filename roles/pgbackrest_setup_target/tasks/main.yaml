- name: Ensure postgres user .ssh directory exists with correct permissions
  file:
    path: /var/lib/postgresql/.ssh
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  run_once: yes
  become: yes

- name: Add database hostnames to repository known_hosts
  shell: |
    key=$(ssh-keyscan -T 10 "{{ item }}" 2>/dev/null | grep -v '^#')
    if [ -n "$key" ]; then
      ssh-keygen -R "{{ item }}" -f /var/lib/postgresql/.ssh/known_hosts 2>/dev/null || true
      echo "$key" >> /var/lib/postgresql/.ssh/known_hosts
    fi
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  loop: "{{ groups['repo_psql'] | difference(groups['role_vm_template'] | default([])) }}"
  become: yes
  become_user: postgres
  changed_when: true

- name: Add database IP addresses to repository known_hosts
  shell: |
    key=$(ssh-keyscan -T 10 "{{ hostvars[item].ansible_host }}" 2>/dev/null | grep -v '^#')
    if [ -n "$key" ]; then
      ssh-keygen -R "{{ hostvars[item].ansible_host }}" -f /var/lib/postgresql/.ssh/known_hosts 2>/dev/null || true
      echo "$key" >> /var/lib/postgresql/.ssh/known_hosts
    fi
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  loop: "{{ groups['repo_psql'] | difference(groups['role_vm_template'] | default([])) }}"
  when: hostvars[item].ansible_host is defined
  become: yes
  become_user: postgres
  changed_when: true

- name: Initialize pgBackRest backup stanza
  command: pgbackrest --stanza=db --log-level-console=info stanza-create
  become: yes
  become_user: postgres
  run_once: yes
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  register: stanza_create
  failed_when: 
    - stanza_create.rc != 0
    - "'stanza already exists' not in stanza_create.stderr"
  changed_when: stanza_create.rc == 0