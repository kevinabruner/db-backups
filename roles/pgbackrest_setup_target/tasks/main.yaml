- name: Ensure postgres user .ssh directory exists
  file:
    path: /var/lib/postgresql/.ssh
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  run_once: yes
  become: yes

- name: Populate repository known_hosts using native Ansible host key facts
  known_hosts:
    name: "{{ hostvars[item].ansible_host | default(item) }}"
    key: "{{ hostvars[item]['ansible_ssh_host_key_ed25519_public'] }}"
    path: /var/lib/postgresql/.ssh/known_hosts
    state: present
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  loop: "{{ groups['repo_psql'] | difference(groups['role_vm_template'] | default([])) }}"
  become: yes
  become_user: postgres

- name: Initialize pgBackRest backup stanza (Idempotent)
  command: pgbackrest --stanza=db --log-level-console=info stanza-create
  become: yes
  become_user: postgres
  environment:
  HOME: /var/lib/postgresql
  run_once: yes
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  register: stanza_create
  failed_when: 
    - stanza_create.rc != 0
    - "'stanza already exists' not in stanza_create.stderr"
  changed_when: stanza_create.rc == 0