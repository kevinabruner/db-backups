- name: Deploy pgbackrest.conf to repository host
  template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: '0640'
  vars:
    active_dbs: "{{ (groups['repo_psql'] | difference(groups['role_vm_template'] | default([]))) | intersect(groups['env_dev']) }}"

- name: Initialize pgBackRest backup stanza
  command: pgbackrest --stanza=db --log-level-console=info stanza-create
  become: yes
  become_user: postgres
  run_once: yes
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  register: stanza_create
  failed_when: 
    - stanza_create.rc != 0
    - "'stanza already exists' not in stanza_create.stderr"
  changed_when: stanza_create.rc == 0