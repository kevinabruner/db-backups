- name: Ensure postgres user .ssh directory has strict 0700 permissions
  file:
    path: /var/lib/postgresql/.ssh
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  run_once: yes
  become: yes

- name: Deploy secure SSH client configuration for postgres user
  copy:
    content: |
      Host *
          StrictHostKeyChecking no
          UserKnownHostsFile /var/lib/postgresql/.ssh/known_hosts
          LogLevel ERROR
    dest: /var/lib/postgresql/.ssh/config
    owner: postgres
    group: postgres
    mode: '0600'
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  run_once: yes
  become: yes

- name: Ensure known_hosts file exists with strict 0600 permissions
  copy:
    content: ""
    dest: /var/lib/postgresql/.ssh/known_hosts
    owner: postgres
    group: postgres
    mode: '0600'
    force: no
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  run_once: yes
  become: yes

- name: Initialize pgBackRest backup stanza (Idempotent)
  command: pgbackrest --stanza=db --log-level-console=info stanza-create
  become: yes
  become_user: postgres
  environment:
    HOME: /var/lib/postgresql
  run_once: yes
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  register: stanza_create
  failed_when: 
    - stanza_create.rc != 0
    - "'stanza already exists' not in stanza_create.stderr"
  changed_when: stanza_create.rc == 0