---
- name: Ensure postgres user .ssh directory exists
  file:
    path: /var/lib/postgresql/.ssh
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  run_once: yes
  become: yes

- name: Initialize pgBackRest backup stanza locally (No Online SSH Check)
  command: pgbackrest --stanza=db --log-level-console=info --no-online stanza-create
  become: yes
  become_user: postgres
  environment:
    HOME: /var/lib/postgresql
  run_once: yes
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  register: stanza_create
  failed_when: 
    - stanza_create.rc != 0
    - "'stanza already exists' not in stanza_create.stderr"
  changed_when: stanza_create.rc == 0