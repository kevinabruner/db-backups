- name: Ensure postgres user exists
  user:
    name: postgres
    system: yes
    shell: /bin/bash
    create_home: yes
    
- name: Create repository directory
  file:
    path: /var/lib/pgbackrest
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'

- name: Read database node public keys
  slurp:
    src: ~postgres/.ssh/id_rsa.pub
  register: db_pubkeys
  delegate_to: "{{ item }}"
  loop: "{{ ansible_play_hosts }}"

- name: Authorize database node keys on backup VM
  authorized_key:
    user: postgres
    key: "{{ item.ansible_facts.slurp_content | default(item['content']) | b64decode }}"
  delegate_to: db-backups
  loop: "{{ db_pubkeys.results }}"