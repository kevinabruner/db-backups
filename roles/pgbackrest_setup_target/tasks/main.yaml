- name: Create repository directory
  file:
    path: /var/lib/pgbackrest
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'

- name: Scan and add database host keys to repository known_hosts
  known_hosts:
    name: "{{ hostvars[item].ansible_host | default(item) }}"
    key: "{{ lookup('pipe', 'ssh-keyscan -T 10 ' + (hostvars[item].ansible_host | default(item))) }}"
    path: "/var/lib/postgresql/.ssh/known_hosts"
    state: present
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  loop: "{{ groups['repo_psql'] | difference(groups['role_vm_template'] | default([])) }}"
  become: yes
  become_user: postgres

- name: Initialize pgBackRest backup stanza
  command: pgbackrest --stanza=db --log-level-console=info stanza-create
  become: yes
  become_user: postgres
  run_once: yes
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  register: stanza_create
  failed_when: 
    - stanza_create.rc != 0
    - "'stanza already exists' not in stanza_create.stderr"
  changed_when: stanza_create.rc == 0