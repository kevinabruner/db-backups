- name: Ensure postgres user exists
  user:
    name: postgres
    system: yes
    shell: /bin/bash
    create_home: yes    

- name: Ensure postgres user .ssh directory exists
  file:
    path: /home/postgres/.ssh
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  delegate_to: "{{ groups['repo_db_backups'][0] }}"
  run_once: yes
  become: yes

- name: Deploy shared private key to all nodes
  copy:
    content: "{{ hostvars['localhost']['shared_private_key']['content'] | b64decode }}"
    dest: /home/postgres/.ssh/id_rsa
    owner: postgres
    group: postgres
    mode: '0600'

- name: Deploy shared public key to all nodes
  copy:
    content: "{{ hostvars['localhost']['shared_public_key']['content'] | b64decode }}"
    dest: /home/postgres/.ssh/id_rsa.pub
    owner: postgres
    group: postgres
    mode: '0644'

- name: Authorize shared public key locally on all nodes
  authorized_key:
    user: postgres
    key: "{{ hostvars['localhost']['shared_public_key']['content'] | b64decode }}"
    state: present