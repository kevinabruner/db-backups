- name: Ensure .ssh directory exists for postgres
  file:
    path: ~postgres/.ssh
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Generate SSH key pair for postgres
  user:
    name: postgres
    generate_ssh_key: yes
    ssh_key_bits: 4096
    ssh_key_file: .ssh/id_rsa
    ssh_key_passphrase: ""
    force: no