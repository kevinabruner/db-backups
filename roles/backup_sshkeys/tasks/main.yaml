- name: Ensure postgres user exists
  user:
    name: postgres
    system: yes
    shell: /bin/bash
    create_home: yes    

- name: Ensure .ssh directory exists for postgres
  file:
    path: ~postgres/.ssh
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Generate SSH key pair for postgres
  openssh_keypair:
    path: ~postgres/.ssh/id_rsa
    type: rsa
    size: 4096
    owner: postgres
    group: postgres
    mode: '0600'