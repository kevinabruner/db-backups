---
- name: Deploy pgBackRest systemd service file
  template:
    src: pgbackrest.service.j2
    dest: "/etc/systemd/system/pgbackrest-{{ pgbackrest_backup_type }}.service"
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd daemon

- name: Deploy pgBackRest systemd timer file
  template:
    src: pgbackrest.timer.j2
    dest: "/etc/systemd/system/pgbackrest-{{ pgbackrest_backup_type }}.timer"
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd daemon

- name: Ensure systemd daemon reloads if templates changed
  meta: flush_handlers

- name: Enable and start pgBackRest backup timer
  systemd:
    name: "pgbackrest-{{ pgbackrest_backup_type }}.timer"
    state: started
    enabled: yes